name: Supply chain

# Manual-only while Crowbar is run strictly locally: nothing triggers on push,
# pull request or schedule. Restore the previous `on:` block (git history) to re-enable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The whole history on every run, against the repository's own
      # .gitleaks.toml. The image is pinned by digest: gitleaks v8.30.1. Older
      # releases (v8.21.2 was checked) silently ignore the `[[allowlists]]`
      # tables that file uses.
      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo"
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build --tag crowbar-ml:scan ml
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: crowbar-ml:scan
          format: spdx-json
          output-file: crowbar-ml.spdx.json
          upload-artifact: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: crowbar-ml:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crowbar-ml-sbom
          path: crowbar-ml.spdx.json
