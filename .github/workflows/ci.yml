name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          NEXT_PUBLIC_DATA_SOURCE: api
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crowbar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d crowbar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crowbar_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/crowbar_test
      REDIS_URL: redis://127.0.0.1:6379/0
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Server dependencies
        run: pip install --require-hashes -r server/requirements-test.lock
      - name: Fresh database migrations
        working-directory: server
        run: python -m db.migrate
      - name: Server tests
        run: python -m pytest server/tests
      - name: ML dependencies and tests
        run: |
          pip install --require-hashes -r ml/requirements-test.lock
          python -m pytest ml/tests
